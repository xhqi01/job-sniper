<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Alert Radar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root {
  --bg: #f7f6f3;
  --white: #fff;
  --border: #e0ddd8;
  --border2: #ccc9c2;
  --text: #1a1a1a;
  --muted: #888880;
  --muted2: #bbb8b0;
  --tag: #eeece8;
  --red: #c0392b;
  --green: #1a7a4a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  padding: 2rem 2.5rem 1.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--white);
}

.logo-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 1rem;
  font-weight: 500;
  margin-bottom: 0.2rem;
}

.logo-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem;
  color: var(--muted);
}

.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: calc(100vh - 90px);
}

/* ── SIDEBAR ── */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 1.8rem 1.5rem;
  background: var(--white);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.section-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem;
  color: var(--muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 0.6rem;
}

.field { display: flex; flex-direction: column; gap: 0.35rem; }

input, select {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.8rem;
  padding: 0.55rem 0;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border2);
  outline: none;
  color: var(--text);
  transition: border-color 0.15s;
  width: 100%;
}

input:focus, select:focus { border-bottom-color: var(--text); }
input::placeholder { color: var(--muted2); }

select { cursor: pointer; }

/* lang pills */
.lang-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.lang-pill {
  padding: 0.3rem 0.75rem;
  border: 1px solid var(--border2);
  background: var(--bg);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  cursor: pointer;
  transition: all 0.12s;
  color: var(--muted);
}

.lang-pill:hover { border-color: var(--text); color: var(--text); }
.lang-pill.active { background: var(--text); border-color: var(--text); color: var(--bg); }

/* toggle */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}

.toggle-label { font-size: 0.78rem; }

.toggle { position: relative; width: 36px; height: 20px; }
.toggle input { display: none; }
.toggle-track {
  position: absolute; inset: 0;
  background: var(--border2); border-radius: 20px;
  cursor: pointer; transition: background 0.2s;
}
.toggle input:checked + .toggle-track { background: var(--text); }
.toggle-thumb {
  position: absolute; top: 3px; left: 3px;
  width: 14px; height: 14px;
  background: white; border-radius: 50%;
  transition: transform 0.2s; pointer-events: none;
}
.toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }

.email-fields {
  display: flex; flex-direction: column; gap: 0.7rem;
  overflow: hidden; max-height: 0; opacity: 0;
  transition: max-height 0.3s ease, opacity 0.3s;
}
.email-fields.open { max-height: 400px; opacity: 1; }

.interval-row {
  display: flex; align-items: center; gap: 0.5rem;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem; color: var(--muted);
}

.interval-row input {
  width: 60px; padding: 0.3rem 0;
  text-align: center;
}

/* buttons */
.btn-scan {
  width: 100%;
  padding: 0.75rem;
  background: var(--text);
  color: var(--bg);
  border: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: opacity 0.15s;
}

.btn-scan:hover { opacity: 0.8; }
.btn-scan:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-monitor {
  width: 100%;
  padding: 0.65rem;
  background: transparent;
  border: 1px solid var(--border2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
}

.btn-monitor:hover { border-color: var(--text); color: var(--text); }
.btn-monitor.active { border-color: var(--green); color: var(--green); }

/* ── CONTENT ── */
.content {
  padding: 2rem 2.5rem;
  display: flex;
  flex-direction: column;
}

.status {
  display: none;
  align-items: center;
  gap: 0.7rem;
  padding: 0.9rem 1rem;
  background: var(--white);
  border: 1px solid var(--border);
  margin-bottom: 1.5rem;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
}
.status.visible { display: flex; }
.status.error { color: var(--red); border-color: #f5c6c6; }
.status.success { color: var(--green); border-color: #d4edda; }

.spinner {
  width: 13px; height: 13px;
  border: 1.5px solid var(--border2);
  border-top-color: var(--text);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.results-header {
  display: none;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 1.2rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid var(--border);
}
.results-header.visible { display: flex; }

.results-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.82rem;
  font-weight: 500;
}

.results-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.62rem;
  color: var(--muted);
}

.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted2);
}

/* job cards */
.job-list { display: flex; flex-direction: column; gap: 0.8rem; }

.job-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 1.2rem 1.5rem;
  animation: cardIn 0.25s ease both;
  transition: border-color 0.15s;
}

.job-card:hover { border-color: var(--border2); }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}

.job-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 0.6rem;
}

.job-title {
  font-size: 0.9rem;
  font-weight: 500;
  line-height: 1.4;
}

.job-title a {
  color: var(--text);
  text-decoration: none;
}

.job-title a:hover { text-decoration: underline; }

.job-source {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.62rem;
  color: var(--muted2);
  white-space: nowrap;
  flex-shrink: 0;
}

.job-tags {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.7rem;
  flex-wrap: wrap;
}

.tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.62rem;
  padding: 0.15rem 0.5rem;
  background: var(--tag);
  color: var(--muted);
}

.tag.en { background: #e8f0fe; color: #1a56db; }
.tag.zh { background: #fef3e8; color: #b45309; }
.tag.jp { background: var(--tag); color: var(--muted); }

.job-summary {
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 0.8rem;
}

.job-link {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  color: var(--text);
  text-decoration: none;
  border-bottom: 1px solid var(--border2);
  transition: border-color 0.12s;
}

.job-link:hover { border-color: var(--text); }

@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
  header, .content { padding: 1.5rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo-title">job alert radar</div>
  <div class="logo-sub">cross-platform · language-filtered · instant alerts</div>
</header>

<div class="layout">

  <aside class="sidebar">

    <div>
      <div class="section-label">Search</div>
      <div class="field" style="margin-bottom:0.8rem">
        <input type="text" id="keywords" placeholder="marketing, finance, analyst…">
      </div>
      <div class="field">
        <input type="text" id="location" placeholder="Tokyo" value="Tokyo">
      </div>
    </div>

    <div>
      <div class="section-label">Working Language</div>
      <div class="lang-pills">
        <div class="lang-pill active" data-lang="any" onclick="toggleLang('any')">Any</div>
        <div class="lang-pill" data-lang="english" onclick="toggleLang('english')">English</div>
        <div class="lang-pill" data-lang="chinese" onclick="toggleLang('chinese')">Chinese</div>
        <div class="lang-pill" data-lang="japanese" onclick="toggleLang('japanese')">Japanese</div>
      </div>
    </div>

    <div>
      <div class="toggle-row">
        <span class="toggle-label">Email alerts</span>
        <label class="toggle">
          <input type="checkbox" id="email-toggle" onchange="toggleEmail()">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>

      <div class="email-fields" id="email-fields">
        <div class="field">
          <input type="email" id="email-sender" placeholder="your Gmail">
        </div>
        <div class="field">
          <input type="password" id="email-pass" placeholder="App Password">
        </div>
        <div class="field">
          <input type="email" id="email-recv" placeholder="send alerts to">
        </div>
        <div class="interval-row">
          Check every
          <input type="number" id="interval" value="60" min="15" max="1440">
          minutes
        </div>
        <div class="toggle-row" style="margin-top:0.5rem">
          <span class="toggle-label" style="font-size:0.72rem">Daily digest</span>
          <label class="toggle">
            <input type="checkbox" id="digest-toggle" onchange="toggleDigestTime()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div id="digest-time-row" style="display:none;align-items:center;gap:0.5rem;margin-top:0.4rem;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--muted)">
          Send at
          <input type="time" id="digest-time" value="18:00" style="width:90px;padding:0.25rem 0.4rem;border:1px solid var(--border2);background:transparent;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--text);outline:none">
          (local time)
        </div>
      </div>
    </div>

    <!-- COMPANY MONITOR -->
    <div>
      <div class="section-label">Company Pages</div>
      <div style="font-size:0.68rem;color:var(--muted2);font-family:'IBM Plex Mono',monospace;margin-bottom:0.6rem">
        Get notified when a careers page changes
      </div>
      <div id="company-list" style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.6rem"></div>
      <div style="display:flex;gap:0.4rem">
        <input type="text" id="company-name" placeholder="Company name" style="flex:1">
      </div>
      <div style="display:flex;gap:0.4rem;margin-top:0.4rem">
        <input type="text" id="company-url" placeholder="Careers page URL" style="flex:1">
      </div>
      <button onclick="addCompany()" style="margin-top:0.5rem;width:100%;padding:0.4rem;background:transparent;border:1px solid var(--border2);font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--muted);cursor:pointer">+ Add company</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:0.5rem;margin-top:auto">
      <button class="btn-scan" id="scan-btn" onclick="scanNow()">Scan Now</button>
      <button class="btn-monitor" id="monitor-btn" onclick="startMonitor()">Start Monitor</button>
    </div>

  </aside>

  <main class="content">

    <div class="status" id="status">
      <div class="spinner" id="spinner"></div>
      <span id="status-text"></span>
    </div>

    <div class="results-header" id="results-header">
      <div class="results-title" id="results-title">Jobs found</div>
      <div class="results-meta" id="results-meta"></div>
    </div>

    <div class="empty-state" id="empty-state">
      enter keywords and scan
    </div>

    <div class="job-list" id="job-list"></div>

  </main>
</div>

<script>
let monitoring = false;
let companies  = [];

function addCompany() {
  const name = document.getElementById('company-name').value.trim();
  const url  = document.getElementById('company-url').value.trim();
  if (!name || !url) return;
  companies.push({ name, url });
  document.getElementById('company-name').value = '';
  document.getElementById('company-url').value  = '';
  renderCompanyList();
}

function removeCompany(i) {
  companies.splice(i, 1);
  renderCompanyList();
}

function renderCompanyList() {
  const list = document.getElementById('company-list');
  list.innerHTML = companies.map((c, i) => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0.4rem 0.6rem;background:var(--white);border:1px solid var(--border);font-size:0.7rem">
      <div>
        <span style="font-family:'IBM Plex Mono',monospace;font-weight:500">${esc(c.name)}</span>
        <div style="font-size:0.6rem;color:var(--muted2);font-family:'IBM Plex Mono',monospace;margin-top:0.1rem">${truncUrl(c.url)}</div>
      </div>
      <button onclick="removeCompany(${i})" style="background:none;border:none;color:var(--muted2);cursor:pointer;font-size:0.9rem">×</button>
    </div>
  `).join('');
}

function truncUrl(url) {
  try { return new URL(url).hostname; } catch { return url.slice(0,30); }
}

let selectedLangs = new Set(['any']);

function toggleLang(lang) {
  if (lang === 'any') {
    selectedLangs = new Set(['any']);
  } else {
    selectedLangs.delete('any');
    if (selectedLangs.has(lang)) {
      selectedLangs.delete(lang);
      if (selectedLangs.size === 0) selectedLangs.add('any');
    } else {
      selectedLangs.add(lang);
    }
  }
  document.querySelectorAll('.lang-pill').forEach(p => {
    p.classList.toggle('active', selectedLangs.has(p.dataset.lang));
  });
}

function getLangFilter() {
  if (selectedLangs.has('any')) return 'any';
  const langs = [...selectedLangs];
  if (langs.includes('english') && langs.includes('chinese')) return 'english_or_chinese';
  if (langs.includes('english')) return 'english';
  if (langs.includes('chinese')) return 'chinese';
  return 'any';
}

function toggleDigestTime() {
  const open = document.getElementById('digest-toggle').checked;
  document.getElementById('digest-time-row').style.display = open ? 'flex' : 'none';
}


function toggleEmail() {
  const open = document.getElementById('email-toggle').checked;
  document.getElementById('email-fields').classList.toggle('open', open);
}

async function scanNow() {
  const keywords = document.getElementById('keywords').value.trim();
  const location = document.getElementById('location').value.trim() || 'Tokyo';
  if (!keywords) return showStatus('Enter job keywords.', 'error');

  document.getElementById('scan-btn').disabled = true;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('results-header').classList.remove('visible');
  document.getElementById('job-list').innerHTML = '';
  showStatus('Scanning platforms…');

  try {
    const res  = await fetch('/api/scan', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keywords, location, lang_filter: getLangFilter(), mark_seen: true }),
    });
    const data = await res.json();
    if (data.error) return showStatus(data.error, 'error');
    renderJobs(data.jobs, keywords, location);
  } catch (e) {
    showStatus('Failed to connect. Is the server running?', 'error');
  } finally {
    document.getElementById('scan-btn').disabled = false;
  }
}

async function startMonitor() {
  if (monitoring) return;

  const keywords   = document.getElementById('keywords').value.trim();
  const location   = document.getElementById('location').value.trim() || 'Tokyo';
  const sender     = document.getElementById('email-sender').value.trim();
  const pass       = document.getElementById('email-pass').value.trim();
  const recv       = document.getElementById('email-recv').value.trim();
  const intervalMn = parseInt(document.getElementById('interval').value) || 60;

  if (!keywords) return showStatus('Enter job keywords.', 'error');
  if (!document.getElementById('email-toggle').checked) {
    return showStatus('Enable email alerts first.', 'error');
  }
  if (!sender || !pass || !recv) return showStatus('Fill in all email fields.', 'error');

  showStatus('Starting monitor…');

  const digest      = document.getElementById('digest-toggle').checked;
  const digest_time = document.getElementById('digest-time').value || '18:00';

  // Start company monitor if companies added
  if (companies.length > 0) {
    fetch('/api/company-monitor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        companies,
        email_sender:   sender,
        email_password: pass,
        email_receiver: recv,
        interval:       intervalMn * 60,
      }),
    }).catch(() => {});
  }

  try {
    const res  = await fetch('/api/notify', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        keywords, location,
        lang_filter:    getLangFilter(),
        daily_digest:   digest,
        digest_time:    digest_time,
        email_sender:   sender,
        email_password: pass,
        email_receiver: recv,
        interval:       intervalMn * 60,
      }),
    });
    const data = await res.json();
    if (data.error) return showStatus(data.error, 'error');

    monitoring = true;
    document.getElementById('monitor-btn').textContent = '● Monitoring active';
    document.getElementById('monitor-btn').classList.add('active');
    showStatus(`Monitoring started — checking every ${intervalMn} min`, 'success');
  } catch (e) {
    showStatus('Failed to start monitor.', 'error');
  }
}

function renderJobs(jobs, keywords, location) {
  hideStatus();

  const header = document.getElementById('results-header');
  header.classList.add('visible');
  document.getElementById('results-title').textContent =
    jobs.length ? `${jobs.length} job${jobs.length > 1 ? 's' : ''} found` : 'No jobs found';
  document.getElementById('results-meta').textContent =
    `${keywords} · ${location} · ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

  const list = document.getElementById('job-list');
  list.innerHTML = '';

  if (!jobs.length) {
    list.innerHTML = '<div style="color:var(--muted2);font-family:monospace;font-size:0.75rem;padding:1rem 0">No new jobs matched your filters. Try different keywords or language settings.</div>';
    return;
  }

  jobs.forEach((j, i) => {
    const tagsHtml = j.lang_tags.map(t =>
      `<span class="tag ${t.toLowerCase()}">${t}</span>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'job-card';
    card.style.animationDelay = `${i * 40}ms`;
    card.innerHTML = `
      <div class="job-top">
        <div class="job-title"><a href="${j.link}" target="_blank">${esc(j.title)}</a></div>
        <div class="job-source">${esc(j.source)}</div>
      </div>
      <div class="job-tags">${tagsHtml}</div>
      ${j.summary ? `<div class="job-summary">${esc(j.summary)}</div>` : ''}
      <a class="job-link" href="${j.link}" target="_blank">View posting →</a>
    `;
    list.appendChild(card);
  });
}

function showStatus(msg, type = '') {
  const s = document.getElementById('status');
  s.className = 'status visible' + (type ? ` ${type}` : '');
  document.getElementById('spinner').style.display = type ? 'none' : 'block';
  document.getElementById('status-text').textContent = msg;
  document.getElementById('scan-btn').disabled = false;
}

function hideStatus() {
  document.getElementById('status').className = 'status';
  document.getElementById('scan-btn').disabled = false;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
